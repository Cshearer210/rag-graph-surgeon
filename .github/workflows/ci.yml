name: CI

on:
  # ⛔ PUSHES ONLY ON main, AND THE REASON IS MEASURED. With a bare `push:` every commit
  # on a branch that has an open pull request ran this whole matrix TWICE -- once for the
  # push and once for the pull_request -- so a single mistake sent TWO failure emails and
  # burned double the minutes. A branch with a PR is already covered by the PR run; main
  # keeps its own run so a merge is still checked.
  push:
    branches: [main]
  pull_request:

# ⛔ LEAST PRIVILEGE, SET EXPLICITLY. Without this block GitHub hands every job a token with
# WRITE access to this repository, so any dependency that runs during a build -- a test plugin, a
# transitive package -- could push a commit. Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    # ⭐ THREE OPERATING SYSTEMS, not one. Added 2026-09-27 after a sibling repo shipped three
    # Windows-only path defects that an ubuntu-only matrix could not see -- and after finding a real
    # one here: stage 1 keyed its by_dir report on an unnormalised os.path.relpath, so it reported
    # `ragghost\tests` on Windows while stages 2 and 4 reported `ragghost/tests`. One tool, two
    # spellings for one directory, and the suite passed on each platform separately because nothing
    # compared them. A matrix is how that stops being invisible.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # The tool has no runtime dependencies; pytest is the only thing needed to run the suite.
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest hypothesis
      - name: Run the test suite
        run: python -m pytest -q tests
      # ⛔ THE EXAMPLES RUN IN CI BECAUSE AN EXAMPLE IS THE FIRST THING A STRANGER TRIES, so one that
      # has quietly stopped working fails in front of them rather than in front of us. It has already
      # earned this: honest_index.py lost its `import random` in a rewrite, every query raised, and
      # the tool -- correctly refusing to score a probe that raised -- said CANNOT TELL. The
      # example's own assertion is what caught it.
      - name: Every example still runs
        run: python examples/run_all.py
      # ⛔ THE README IS THE ONE FILE EVERY STRANGER READS AND THE ONE FILE NO TEST TOUCHES, so it
      # rots silently and fails in front of the person you most wanted to impress. This types what it
      # tells a stranger to type and checks the exit code each command is DOCUMENTED to return --
      # several are supposed to be non-zero, and a checker asserting "exit 0" would call the tool
      # broken for doing the thing it is being shown doing. It also re-counts the tests and
      # re-measures coverage, because a number typed into a document cannot notice it went wrong.
      - name: The README still describes this tool
        run: python tools/readme_runs.py --tests

  install:
    # ⛔ THIS JOB EXISTS BECAUSE THE SUITE ABOVE CANNOT SEE THE FAILURES THAT MATTER MOST TO A
    # STRANGER. The tests run from the source tree, where imports work whether or not the package
    # installs, and they cannot see that the wheel shipped no console command at all -- which was
    # true here until 2026-09-27: it installed cleanly and left you with nothing to type.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package the way a stranger would
        run: python -m pip install .
      - name: The console command exists and answers
        # ⛔ THIS STEP IS THE ONE THAT FOUND THE cp1252 CRASH, and it found it because it is the only
        # Windows step with no honest reason to tolerate a non-zero exit. `ragghost check .` below is
        # `continue-on-error` because `check` exits 1 when it finds something -- which meant a CRASH
        # and a FINDING produced the same green tick there for three days.
        run: ragghost --help
      - name: A report prints on THIS console without crashing, markers and all
        # Every report marks a finding with ⛔ and a caveat with ⚠, and a Windows console is cp1252,
        # which has neither. The test suite cannot see this on its own: pytest captures output into a
        # buffer with no code page, so testing removes the condition. tests/test_console_encoding.py
        # builds a hostile stream to cover it portably; this step is the same question asked of the
        # REAL console the runner gives us, which is the thing a stranger actually has.
        run: python -c "import os,tempfile,ragghost; d=tempfile.mkdtemp(); open(os.path.join(d,'main.py'),'w').write('A=1\n'); open(os.path.join(d,'orphan.py'),'w').write('B=2\n'); ragghost.console_safe(); g=ragghost.build_graph(d); assert g.orphans, 'fixture printed no marker'; g.report()"
      # `cd ..` on purpose: from the repo root the source tree is importable whether or not the
      # install worked, so a doctor run there would pass on a broken wheel.
      - name: The install verifies itself, from outside the source tree
        # Six checks, two of which run the whole repair road -- so this step alone fails if the
        # wheel shipped the read-only stages and left ragghost.surgeon out of `packages`.
        run: ragghost doctor
        working-directory: ..
      # ⛔ AND THE REPAIR HALF IS RUN FOR REAL, FROM THE INSTALL, ON THE EXAMPLE. The doctor builds
      # its own synthetic system, which proves the road works but never touches examples/broken-shop
      # -- and a stranger's first command is the one in the README, against that example. If the
      # example stops shipping a store, this is what says so.
      - name: It repairs the worked example and ships a graded storefront
        run: ragghost surgeon examples/broken-shop --output landing --name "Aurora Goods" --out ../shipped
      - name: The shipped storefront really exists
        run: python -c "import os,sys; p=os.path.join('..','shipped','index.html'); sys.exit(0 if os.path.exists(p) else 'no index.html shipped')"
      - name: And it audits a real system -- itself -- without crashing
        run: ragghost check .
        # `check` exits 1 when it finds something, which is not a CI failure here: this step proves
        # the command runs end to end on a real tree. 2 (could not tell) IS a failure.
        continue-on-error: true

  security:
    # ⛔ A DEPENDENCY AUDIT, RUN ON EVERY PUSH. A tool whose job is finding defects that hide is
    # not allowed to ship with a known-vulnerable dependency chain; and the honest place to learn
    # that is here, on every change, rather than from whoever downloads it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install this package and the auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit
      - name: Audit the installed dependency chain
        # ⛔ NO `--strict`, AND THE REASON IS NOT LAXITY. `--strict` fails the run when
        # pip-audit cannot RESOLVE a package on PyPI, and this package is not published -- so the
        # job went red reporting "dependency not found on PyPI" as though it were an advisory.
        # An actual vulnerability still exits non-zero without the flag, which is the property
        # this job exists for.
        run: python -m pip_audit --progress-spinner off
