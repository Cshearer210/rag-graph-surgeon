[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-graph-surgeon"
version = "0.2.0"
description = "Point it at a broken system: it finds what is actually wrong, repairs an isolated copy of it, and ships the output you wanted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Shearer" }]
keywords = ["static-analysis", "dependency-graph", "dead-code", "ci", "audit"]
# The runtime is deliberately zero-dependency: a stranger's checkout needs only the standard library.
dependencies = []

# Development-only extras. `pip install -e .[test]` pulls the test runner and the property-based
# testing library; NONE of these are required to run the tool itself.
[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6.168.0", "coverage>=7"]

# ⭐ THE CONSOLE SCRIPT. Added 2026-09-27: until then this installed cleanly and left a stranger
# with nothing to type -- you had to already know to say `python3 -m ragghost`. Both entry points
# call the same `main`, so nothing that already used the module form breaks.
[project.scripts]
ragghost = "ragghost.__main__:main"

[project.urls]
Repository = "https://github.com/Cshearer210/rag-graph-surgeon"

# The import package is `ragghost`; the distribution is `rag-graph-surgeon`.
#
# ⛔ EVERY SUBPACKAGE MUST BE NAMED HERE. This list is explicit rather than auto-discovered, so a
# subpackage left out of it is simply absent from the wheel: `pip install` succeeds, `import
# ragghost` succeeds, and the missing half explodes on a stranger's machine. The source tree can
# never see that, because there the imports work whether or not the install did. `ragghost doctor`
# imports every module the surgeon names, which is what turns this from a silent omission into a
# failing check.
[tool.setuptools]
packages = ["ragghost", "ragghost.surgeon", "ragghost.surgeon.builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ragghost"]

[tool.coverage.report]
show_missing = true

# ruff: lint for real defects (pyflakes F + pycodestyle E/W) rather than style opinions.
# E501 (line length) is relaxed -- this codebase uses long, deliberately descriptive report strings;
# E402 is relaxed because the tests intentionally adjust sys.path before importing the package.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
